# Cấu hình Card Agent (đọc từ thư mục làm việc smartcard/agent)
port=31999
# Chế độ: pcsc (đầu đọc thật) hoặc sim (jCardSim); có thể ghi đè bằng --sim
mode=pcsc
# Tên đầu đọc PC/SC (để trống = dùng đầu đọc đầu tiên)
reader=
# Danh sách Origin được phép, phân tách bằng dấu phẩy
allowedOrigins=http://localhost:3000,http://127.0.0.1:3000
